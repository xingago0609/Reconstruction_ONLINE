# This production configuration creates a paid service and persistent disk.
# Review the provider's current price before deploying it.
services:
  - type: web
    name: reconstruction-public-sync
    runtime: node
    plan: 0.5c-512mb
    rootDir: PublicSyncServer
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /var/data/rooms.json
    disk:
      name: public-card-state
      mountPath: /var/data
      sizeGB: 1
