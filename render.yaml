# Free service. Room data may be lost when the service restarts or spins down.
services:
  - type: web
    name: reconstruction-public-sync
    runtime: node
    plan: free
    region: singapore
    rootDir: PublicSyncServer
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: data/rooms.json
